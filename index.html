<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campo trazadores">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Campo trazadores</title>
<style>
:root{--az:#1F3864;--gr:#5b6577;--bd:#d5dae3;--fd:#f4f6fa;--ro:#c0392b;--am:#9a6700;--ok:#2e8b57}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d2433;background:#fff;padding-bottom:5rem}
header{background:var(--az);color:#fff;padding:.5rem 1rem;position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:.6rem;justify-content:space-between}
header h1{margin:0;font-size:1rem}header select{width:auto;max-width:55%;padding:.3rem}
#resp{background:#fff4e5;color:#7a4b00;border-bottom:1px solid #f0d4a8;padding:.4rem 1rem;font-size:.85rem;align-items:center;justify-content:space-between;gap:.6rem}
#gps{padding:.35rem 1rem;font-size:.85rem;background:#eef1f7;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
nav{display:flex;gap:.25rem;background:var(--fd);padding:.35rem;position:sticky;top:2.9rem;z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:.55rem .1rem;border:1px solid var(--bd);background:#fff;border-radius:.5rem;font-size:.8rem}
nav button.on{background:var(--az);color:#fff;border-color:var(--az)}
main{padding:.6rem 1rem;max-width:62rem;margin:auto}
section{display:none}section.on{display:block}
h2{font-size:1.05rem;color:var(--az);margin:1rem 0 .3rem}
.nota{color:var(--gr);font-size:.84rem;margin:.2rem 0}
.card{border:1px solid var(--bd);border-radius:.6rem;padding:.7rem;margin:.6rem 0;background:#fff}
.fila{display:flex;flex-wrap:wrap;gap:.55rem}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--gr);flex:1 1 8.5rem}
input,select,textarea{font:inherit;padding:.5rem;border:1px solid var(--bd);border-radius:.4rem;width:100%;color:#1d2433;background:#fff}
textarea{min-height:3.5rem}
button.b{padding:.7rem 1rem;border:0;border-radius:.5rem;background:var(--az);color:#fff;font-size:1rem}
button.g{background:#e8ebf2;color:var(--az)}button.p{padding:.35rem .65rem;font-size:.85rem}button.r{background:var(--ro)}
button:disabled{opacity:.5}
.kpi{display:flex;gap:.6rem;flex-wrap:wrap}.kpi div{flex:1 1 7rem;border:1px solid var(--bd);border-radius:.6rem;padding:.4rem .7rem}
.kpi b{display:block;font-size:1.45rem;color:var(--az)}
.adv{color:var(--am);margin:.3rem 0}.err{color:var(--ro);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid var(--bd);padding:.3rem;text-align:left}th{color:var(--gr);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}
.crono{font-size:2.1rem;font-weight:700;color:var(--az);font-variant-numeric:tabular-nums;text-align:center}
.est{border-left:5px solid var(--az)}.est.ya{border-left-color:var(--ok)}.est.ahora{border-left-color:var(--ro);background:#fff6f4}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:1rem;background:#e8ebf2;font-size:.78rem}
.rec{border:2px solid var(--ro);background:#fff6f4}
.pt{display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.mapa{width:100%;height:auto;background:#f7f9fc;border:1px solid var(--bd);border-radius:.5rem}
svg text{font-size:11px;fill:#444}
</style>
</head>
<body>
<header><h1>📍 Campo · trazadores</h1><select id="sel-camp" aria-label="Campaña"></select></header>
<div id="gps"><span id="gps-est">GPS apagado</span><span id="gps-btn"></span></div>
<div id="resp" style="display:none"></div>
<nav id="nav"><button data-t="pun" class="on">Puntos</button><button data-t="rec">Recorrido</button><button data-t="prog">Programar</button><button data-t="camp">Campaña</button><button data-t="exp">Guardar</button></nav>
<main>
<section id="t-pun" class="on"></section>
<section id="t-rec"></section>
<section id="t-prog"></section>
<section id="t-camp"></section>
<section id="t-exp"></section>
</main>
<script src="app.js"></script>
</body>
</html>
